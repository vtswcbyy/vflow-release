name: Build & Release App

# ────────────────────────────────────────────────────────────
#  触发条件:
#    - 手动触发 (workflow_dispatch): 仅仓库所有者/写权限者可触发
#    - 远程触发 (repository_dispatch): 仅携带有效 Secret Token 的请求可触发
#    - 严格杜绝 PR (绝无 pull_request 监听，外部 PR 无法运行任何构建)
# ────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      private_repo:
        description: '私有代码库 (格式: owner/repo)'
        required: true
        default: 'vtswcbyy/vcash'
        type: string
      git_ref:
        description: '构建的分支 / Tag / Commit SHA (如 master 或 v0.1.0)'
        required: true
        default: 'master'
        type: string
      platform:
        description: '目标构建平台'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - linux
          - macos
      create_release:
        description: '是否发布到 GitHub Release'
        required: false
        default: true
        type: boolean
      release_tag:
        description: 'Release Tag (留空则全自动从 Cargo.toml 解析，如 v0.1.0)'
        required: false
        default: ''
        type: string

  repository_dispatch:
    types: [trigger-release-build]

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: stable

jobs:
  # ══════════════════════════════════════════════════════════
  #  0. 版本号有效性与重复 Release 熔断预检 (耗时 ~5 秒)
  # ══════════════════════════════════════════════════════════
  precheck:
    name: "Pre-check & Version Conflict Check"
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.check_version.outputs.release_tag }}
    steps:
      - name: Checkout Private Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.private_repo || inputs.private_repo }}
          ref: ${{ github.event.client_payload.git_ref || inputs.git_ref }}
          token: ${{ secrets.PRIVATE_REPO_VCASH_TOKEN }}

      - name: Check Version & Detect Duplicate Release
        id: check_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "================================================================================"
          echo "🔍 [前置预检] 版本号解析与已有 Release 重复冲突检查"
          echo "--------------------------------------------------------------------------------"
          
          # 1. 解析目标版本号
          TAG="${{ github.event.client_payload.release_tag || inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            PKG_VER=$(grep -m1 '^version =' Cargo.toml | cut -d '"' -f 2)
            TAG="v${PKG_VER}"
          fi
          
          echo "📌 本次构建解析目标版本: $TAG"
          
          DO_RELEASE="${{ github.event.client_payload.create_release || inputs.create_release }}"
          if [ -z "$DO_RELEASE" ]; then
            DO_RELEASE="true"
          fi
          
          # 2. 检查公开仓库中是否已存在同平台的 Release 资产
          if [ "$DO_RELEASE" = "true" ]; then
            PLATFORM="${{ github.event.client_payload.platform || inputs.platform || 'all' }}"
            echo "🎯 目标构建平台: $PLATFORM"
            echo "🔍 正在检查公开仓库是否已有已发布的同名 Release: $TAG ..."
            
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "ℹ️  公开仓库中已存在 Release: $TAG，正在校验已发布的平台资产..."
              EXISTING_ASSETS=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null || true)
              echo "📦 当前已存在的资产列表:"
              if [ -n "$EXISTING_ASSETS" ]; then
                echo "$EXISTING_ASSETS" | sed 's/^/   - /'
              else
                echo "   (暂无文件资产)"
              fi
              
              WIN_MATCHES=$(echo "$EXISTING_ASSETS" | grep -iE "windows|win-x86|win64" || true)
              LINUX_MATCHES=$(echo "$EXISTING_ASSETS" | grep -iE "linux" || true)
              MAC_MATCHES=$(echo "$EXISTING_ASSETS" | grep -iE "macos|darwin|apple|arm64" || true)
              
              CONFLICT_FOUND=0
              CONFLICT_MSG=""
              
              if [ "$PLATFORM" = "windows" ]; then
                if [ -n "$WIN_MATCHES" ]; then
                  CONFLICT_FOUND=1
                  CONFLICT_MSG="Windows 平台资产已存在 ($(echo $WIN_MATCHES | tr '\n' ' '))"
                fi
              elif [ "$PLATFORM" = "linux" ]; then
                if [ -n "$LINUX_MATCHES" ]; then
                  CONFLICT_FOUND=1
                  CONFLICT_MSG="Linux 平台资产已存在 ($(echo $LINUX_MATCHES | tr '\n' ' '))"
                fi
              elif [ "$PLATFORM" = "macos" ]; then
                if [ -n "$MAC_MATCHES" ]; then
                  CONFLICT_FOUND=1
                  CONFLICT_MSG="macOS 平台资产已存在 ($(echo $MAC_MATCHES | tr '\n' ' '))"
                fi
              elif [ "$PLATFORM" = "all" ]; then
                CONFLICT_LIST=""
                [ -n "$WIN_MATCHES" ] && CONFLICT_LIST="${CONFLICT_LIST}Windows ($(echo $WIN_MATCHES | tr '\n' ' ')) "
                [ -n "$LINUX_MATCHES" ] && CONFLICT_LIST="${CONFLICT_LIST}Linux ($(echo $LINUX_MATCHES | tr '\n' ' ')) "
                [ -n "$MAC_MATCHES" ] && CONFLICT_LIST="${CONFLICT_LIST}macOS ($(echo $MAC_MATCHES | tr '\n' ' ')) "
                if [ -n "$CONFLICT_LIST" ]; then
                  CONFLICT_FOUND=1
                  CONFLICT_MSG="全平台构建 (all) 模式下检测到已有平台资产: ${CONFLICT_LIST}"
                fi
              fi
              
              if [ "$CONFLICT_FOUND" -eq 1 ]; then
                echo "================================================================================"
                echo "❌ ❌ ❌ [构建熔断拦截: 该平台产物已存在] ❌ ❌ ❌"
                echo "--------------------------------------------------------------------------------"
                echo "⚠️  公开仓库 ${{ github.repository }} 的 Release $TAG 中已存在当前平台的构建产物！"
                echo "📌 冲突详情: $CONFLICT_MSG"
                echo "💡 规则: 同一个平台不允许重复覆盖已有版本的构建产物。"
                echo "👉 解决方法:"
                echo "   1. 如需发布新版本，请在本地修改 Cargo.toml 中的 version (递增版本号) 并推送；"
                echo "   2. 若为多平台分批构建，请在触发弹窗的 platform 选项中选择尚未构建的具体平台 (如 windows / linux / macos)；"
                echo "   3. 或者在 Run workflow 触发弹窗中手动填写一个不同的 release_tag。"
                echo "================================================================================"
                exit 1
              fi
              echo "✅ 平台资产校验通过: Release $TAG 虽已存在，但目标平台 ($PLATFORM) 尚无重复产物，允许增量构建并发布！"
            else
              echo "✅ Release $TAG 尚不存在，无重复历史 Release，允许新建发布！"
            fi
          fi
          
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT
          echo "================================================================================"

  # ══════════════════════════════════════════════════════════
  #  1. Windows 构建 (x86_64 MSVC — CUDA + Vulkan)
  # ══════════════════════════════════════════════════════════
  build-windows:
    name: "Windows (x86_64, CUDA + Vulkan)"
    needs: [precheck]
    if: |
      github.event_name == 'repository_dispatch' ||
      inputs.platform == 'windows' ||
      inputs.platform == 'all'
    runs-on: windows-2022

    steps:
      - name: Print Windows Hardware & System Diagnostic Info
        shell: pwsh
        run: |
          Write-Host "================================================================================" -ForegroundColor Cyan
          Write-Host "🖥️  [Windows 构建机系统与硬件环境诊断]" -ForegroundColor Cyan
          Write-Host "--------------------------------------------------------------------------------"
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host ("📌 操作系统: " + $os.Caption + " (" + $os.Version + ", Build " + $os.BuildNumber + ") [Arch: " + $os.OSArchitecture + "]")
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          Write-Host ("🧠 CPU 处理器: " + $cpu.Name.Trim() + " [核心数: " + $cpu.NumberOfCores + ", 逻辑线程数: " + $cpu.NumberOfLogicalProcessors + "]")
          $cs = Get-CimInstance Win32_ComputerSystem
          $memGB = [math]::Round($cs.TotalPhysicalMemory / 1GB, 2)
          $freeMemGB = [math]::Round($os.FreePhysicalMemory / 1MB, 2)
          Write-Host ("💾 物理内存: 总计 " + $memGB + " GB (当前可用: " + $freeMemGB + " GB)")
          Write-Host "💽 磁盘驱动器空间列表:"
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{Name="Total(GB)";Expression={[math]::Round(($_.Used + $_.Free)/1GB,2)}}, @{Name="Used(GB)";Expression={[math]::Round($_.Used/1GB,2)}}, @{Name="Free(GB)";Expression={[math]::Round($_.Free/1GB,2)}} | Format-Table -AutoSize
          Write-Host "================================================================================" -ForegroundColor Cyan

      - name: Checkout Private Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.private_repo || inputs.private_repo }}
          ref: ${{ github.event.client_payload.git_ref || inputs.git_ref }}
          token: ${{ secrets.PRIVATE_REPO_VCASH_TOKEN }}
          submodules: recursive

      - name: Auto-Download Precompiled Engines (qwentts.cpp & stable-diffusion.cpp)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_VCASH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "================================================================================"
          echo "📥 [自动下载 Windows 预编译底层引擎库] (CUDA 12.x + Vulkan)"
          echo "--------------------------------------------------------------------------------"
          
          PKG_VER=$(grep -m1 '^version =' Cargo.toml | cut -d '"' -f 2)
          MAIN_TAG="v${PKG_VER}"
          BASE_TAG="v$(echo "$PKG_VER" | cut -d. -f1,2).0"
          echo "📌 主项目当前版本: $MAIN_TAG (基准对应引擎版本: $BASE_TAG)"
          
          TARGET_DIR="backends/x86_64-pc-windows-msvc"
          mkdir -p "$TARGET_DIR"

          echo "🔍 正在从 vtswcbyy/qwentts.cpp 拉取 Windows 预编译引擎包..."
          gh release download "$MAIN_TAG" --repo "vtswcbyy/qwentts.cpp" --pattern "*windows-x86_64*" --dir "$TARGET_DIR" 2>/dev/null || \
          gh release download "$BASE_TAG" --repo "vtswcbyy/qwentts.cpp" --pattern "*windows-x86_64*" --dir "$TARGET_DIR" 2>/dev/null || \
          gh release download --repo "vtswcbyy/qwentts.cpp" --pattern "*windows-x86_64*" --dir "$TARGET_DIR" 2>/dev/null || {
            echo "⚠️ [提示] 未能从 qwentts.cpp 获取到预编译包，将按需自愈编译或复用已有文件"
          }

          echo "🔍 正在从 vtswcbyy/stable-diffusion.cpp 拉取 Windows 预编译引擎包..."
          gh release download "$MAIN_TAG" --repo "vtswcbyy/stable-diffusion.cpp" --pattern "*windows-x86_64*" --dir "$TARGET_DIR" 2>/dev/null || \
          gh release download "$BASE_TAG" --repo "vtswcbyy/stable-diffusion.cpp" --pattern "*windows-x86_64*" --dir "$TARGET_DIR" 2>/dev/null || \
          gh release download --repo "vtswcbyy/stable-diffusion.cpp" --pattern "*windows-x86_64*" --dir "$TARGET_DIR" 2>/dev/null || {
            echo "⚠️ [提示] 未能从 stable-diffusion.cpp 获取到预编译包，将按需自愈编译或复用已有文件"
          }

          cd "$TARGET_DIR"
          for f in *.tar.gz; do
            if [ -f "$f" ]; then
              echo "📦 正在解压: $f"
              tar -xzf "$f"
              rm -f "$f"
            fi
          done
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "📦 正在解压: $f"
              unzip -o -q "$f"
              rm -f "$f"
            fi
          done
          cd - > /dev/null

          echo "✅ [Windows 预编译引擎就绪状态]:"
          ls -la "$TARGET_DIR"
          echo "================================================================================"

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo & Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tmp_build
            target
          key: windows-build-v2-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-build-v2-${{ hashFiles('**/Cargo.lock') }}-
            windows-build-v2-

      - name: Build & Package Windows Release
        shell: bash
        run: |
          # 执行项目自身的 Windows 打包脚本（由于已放入预编译库，将自动秒级跳过 CMake 编译）
          bash ./package_win.sh package

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/latest/launcher*.exe
            dist/latest/manifest.json
            dist/latest/packages/
            dist/**/*.zip
            dist/**/*.tar.gz
            dist/**/*.tar.zst
            dist/**/*.exe
            *-windows-x86_64.zip
          if-no-files-found: warn
          retention-days: 7

  # ══════════════════════════════════════════════════════════
  #  2. Linux 构建 (Ubuntu 20.04 glibc 2.31 — CUDA + Vulkan)
  # ══════════════════════════════════════════════════════════
  build-linux:
    name: "Linux (Ubuntu 20.04, CUDA + Vulkan)"
    needs: [precheck]
    if: |
      github.event_name == 'repository_dispatch' ||
      inputs.platform == 'linux' ||
      inputs.platform == 'all'
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
      options: --privileged
    defaults:
      run:
        shell: bash

    steps:
      - name: Print Linux Diagnostic Info
        run: |
          echo "================================================================================"
          echo "🖥️  [Linux 构建机系统与硬件环境诊断]"
          echo "--------------------------------------------------------------------------------"
          echo "📌 操作系统: $(uname -s -r -m)"
          [ -f /etc/os-release ] && grep -E '^(PRETTY_NAME|NAME|VERSION)=' /etc/os-release || true
          echo "🧠 CPU 处理器: $(grep -m1 'model name' /proc/cpuinfo 2>/dev/null | cut -d: -f2 | xargs || echo 'N/A') [核心数: $(nproc 2>/dev/null || echo 1)]"
          echo "💾 物理内存: $(free -h 2>/dev/null | awk '/^Mem:/{print "总计: "$2", 已用: "$3", 可用: "$7}' || echo 'N/A')"
          df -h -x tmpfs -x devtmpfs -x overlay 2>/dev/null || df -h
          echo "================================================================================"

      - name: Install System Base Dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            software-properties-common curl wget git pkg-config ccache \
            libasound2-dev tar gzip xz-utils ca-certificates gnupg build-essential unzip
          # 安装 GitHub CLI (gh) 用于安全下载 release 产物
          type -p curl >/dev/null || apt-get install curl -y
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          apt-get update
          apt-get install gh -y || true

      - name: Checkout Private Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.private_repo || inputs.private_repo }}
          ref: ${{ github.event.client_payload.git_ref || inputs.git_ref }}
          token: ${{ secrets.PRIVATE_REPO_VCASH_TOKEN }}
          submodules: recursive

      - name: Auto-Download Precompiled Engines (qwentts.cpp & stable-diffusion.cpp)
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_VCASH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "================================================================================"
          echo "📥 [自动下载 Linux 预编译底层引擎库] (CUDA 12.x + Vulkan)"
          echo "--------------------------------------------------------------------------------"
          
          PKG_VER=$(grep -m1 '^version =' Cargo.toml | cut -d '"' -f 2)
          MAIN_TAG="v${PKG_VER}"
          BASE_TAG="v$(echo "$PKG_VER" | cut -d. -f1,2).0"
          echo "📌 主项目当前版本: $MAIN_TAG (基准对应引擎版本: $BASE_TAG)"

          TARGET_DIR="backends/x86_64-unknown-linux-gnu"
          mkdir -p "$TARGET_DIR"

          echo "🔍 正在从 vtswcbyy/qwentts.cpp 拉取 Linux 预编译引擎包..."
          gh release download "$MAIN_TAG" --repo "vtswcbyy/qwentts.cpp" --pattern "*linux-x86_64*" --dir "$TARGET_DIR" 2>/dev/null || \
          gh release download "$BASE_TAG" --repo "vtswcbyy/qwentts.cpp" --pattern "*linux-x86_64*" --dir "$TARGET_DIR" 2>/dev/null || \
          gh release download --repo "vtswcbyy/qwentts.cpp" --pattern "*linux-x86_64*" --dir "$TARGET_DIR" 2>/dev/null || {
            echo "⚠️ [提示] 未能从 qwentts.cpp 获取到预编译包，将按需自愈编译或复用已有文件"
          }

          echo "🔍 正在从 vtswcbyy/stable-diffusion.cpp 拉取 Linux 预编译引擎包..."
          gh release download "$MAIN_TAG" --repo "vtswcbyy/stable-diffusion.cpp" --pattern "*linux-x86_64*" --dir "$TARGET_DIR" 2>/dev/null || \
          gh release download "$BASE_TAG" --repo "vtswcbyy/stable-diffusion.cpp" --pattern "*linux-x86_64*" --dir "$TARGET_DIR" 2>/dev/null || \
          gh release download --repo "vtswcbyy/stable-diffusion.cpp" --pattern "*linux-x86_64*" --dir "$TARGET_DIR" 2>/dev/null || {
            echo "⚠️ [提示] 未能从 stable-diffusion.cpp 获取到预编译包，将按需自愈编译或复用已有文件"
          }

          cd "$TARGET_DIR"
          for f in *.tar.gz; do
            if [ -f "$f" ]; then
              echo "📦 正在解压: $f"
              tar -xzf "$f"
              rm -f "$f"
            fi
          done
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "📦 正在解压: $f"
              unzip -o -q "$f"
              rm -f "$f"
            fi
          done
          cd - > /dev/null

          echo "✅ [Linux 预编译引擎就绪状态]:"
          ls -la "$TARGET_DIR"
          echo "================================================================================"

      - name: Cache Cargo & Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.ccache
            tmp_build
            target
          key: linux-build-v2-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            linux-build-v2-${{ hashFiles('**/Cargo.lock') }}-
            linux-build-v2-

      - name: Build & Package Linux Release
        run: |
          # package_linux.sh 会自动自愈安装环境并执行打包
          bash ./package_linux.sh package

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dist/latest/launcher*
            dist/latest/manifest.json
            dist/latest/packages/
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/**/*.tar.zst
            *-linux-x86_64.tar.gz
          if-no-files-found: warn
          retention-days: 7

  # ══════════════════════════════════════════════════════════
  #  3. macOS 构建 (Apple Silicon ARM64 — Metal 加速)
  # ══════════════════════════════════════════════════════════
  build-macos:
    name: "macOS (Apple Silicon ARM64, Metal)"
    needs: [precheck]
    if: |
      github.event_name == 'repository_dispatch' ||
      inputs.platform == 'macos' ||
      inputs.platform == 'all'
    runs-on: macos-14
    defaults:
      run:
        shell: bash

    steps:
      - name: Print macOS Hardware & System Diagnostic Info
        run: |
          echo "================================================================================"
          echo "🖥️  [macOS Apple Silicon 构建机环境诊断]"
          echo "--------------------------------------------------------------------------------"
          echo "📌 操作系统: $(sw_vers -productName) $(sw_vers -productVersion) (Build $(sw_vers -buildVersion)) [Arch: $(uname -m)]"
          echo "🧠 CPU 处理器: $(sysctl -n machdep.cpu.brand_string 2>/dev/null || sysctl -n hw.model) [逻辑核心: $(sysctl -n hw.ncpu)]"
          echo "💾 物理内存: $(($(sysctl -n hw.memsize) / 1024 / 1024 / 1024)) GB"
          echo "💽 磁盘空间:"
          df -h /
          echo "================================================================================"

      - name: Checkout Private Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.private_repo || inputs.private_repo }}
          ref: ${{ github.event.client_payload.git_ref || inputs.git_ref }}
          token: ${{ secrets.PRIVATE_REPO_VCASH_TOKEN }}
          submodules: recursive

      - name: Auto-Download Precompiled Engines (qwentts.cpp & stable-diffusion.cpp)
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_VCASH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "================================================================================"
          echo "📥 [自动下载 macOS 预编译底层引擎库] (Apple Silicon ARM64 Metal)"
          echo "--------------------------------------------------------------------------------"
          
          PKG_VER=$(grep -m1 '^version =' Cargo.toml | cut -d '"' -f 2)
          MAIN_TAG="v${PKG_VER}"
          BASE_TAG="v$(echo "$PKG_VER" | cut -d. -f1,2).0"
          echo "📌 主项目当前版本: $MAIN_TAG (基准对应引擎版本: $BASE_TAG)"

          TARGET_DIR="backends/aarch64-apple-darwin"
          mkdir -p "$TARGET_DIR"

          echo "🔍 正在从 vtswcbyy/qwentts.cpp 拉取 macOS ARM64 预编译引擎包..."
          gh release download "$MAIN_TAG" --repo "vtswcbyy/qwentts.cpp" --pattern "*macos-arm64*" --dir "$TARGET_DIR" 2>/dev/null || \
          gh release download "$BASE_TAG" --repo "vtswcbyy/qwentts.cpp" --pattern "*macos-arm64*" --dir "$TARGET_DIR" 2>/dev/null || \
          gh release download --repo "vtswcbyy/qwentts.cpp" --pattern "*macos-arm64*" --dir "$TARGET_DIR" 2>/dev/null || {
            echo "⚠️ [提示] 未能从 qwentts.cpp 获取到预编译包，将按需自愈编译或复用已有文件"
          }

          echo "🔍 正在从 vtswcbyy/stable-diffusion.cpp 拉取 macOS ARM64 预编译引擎包..."
          gh release download "$MAIN_TAG" --repo "vtswcbyy/stable-diffusion.cpp" --pattern "*macos-arm64*" --dir "$TARGET_DIR" 2>/dev/null || \
          gh release download "$BASE_TAG" --repo "vtswcbyy/stable-diffusion.cpp" --pattern "*macos-arm64*" --dir "$TARGET_DIR" 2>/dev/null || \
          gh release download --repo "vtswcbyy/stable-diffusion.cpp" --pattern "*macos-arm64*" --dir "$TARGET_DIR" 2>/dev/null || {
            echo "⚠️ [提示] 未能从 stable-diffusion.cpp 获取到预编译包，将按需自愈编译或复用已有文件"
          }

          cd "$TARGET_DIR"
          for f in *.tar.gz; do
            if [ -f "$f" ]; then
              echo "📦 正在解压: $f"
              tar -xzf "$f"
              rm -f "$f"
            fi
          done
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "📦 正在解压: $f"
              unzip -o -q "$f"
              rm -f "$f"
            fi
          done
          cd - > /dev/null

          echo "✅ [macOS 预编译引擎就绪状态]:"
          ls -la "$TARGET_DIR"
          echo "================================================================================"

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin

      - name: Cache Cargo & Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            tmp_build
            target
          key: macos-build-v2-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            macos-build-v2-${{ hashFiles('**/Cargo.lock') }}-
            macos-build-v2-

      - name: Build & Package macOS Release
        run: |
          # package_mac.sh 会自动执行前端混淆并完成 macOS 安装包打包
          bash ./package_mac.sh package

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            dist/latest/launcher*
            dist/latest/manifest.json
            dist/latest/packages/
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/**/*.tar.zst
            *-macos-arm64.tar.gz
          if-no-files-found: warn
          retention-days: 7

  # ══════════════════════════════════════════════════════════
  #  4. 发布 GitHub Release (自动挂载到当前公开仓库)
  # ══════════════════════════════════════════════════════════
  publish-release:
    name: "Publish GitHub Release"
    needs: [precheck, build-windows, build-linux, build-macos]
    if: |
      always() &&
      needs.precheck.result == 'success' &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
      (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') &&
      (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') &&
      (
        github.event_name == 'repository_dispatch' ||
        inputs.create_release == true
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets/

      - name: List and Prepare Release Assets
        shell: bash
        run: |
          mkdir -p dist/latest/packages/
          # 规范提取 manifest.json 与各平台启动器至 dist/latest/ 根目录
          find release_assets/ -type f -name "manifest.json" -exec cp -f {} dist/latest/ \;
          find release_assets/ -type f \( -name "launcher*" -o -name "*.exe" \) -exec cp -f {} dist/latest/ \;

          # 规范合并所有平台的 packages 子包
          for pdir in $(find release_assets/ -type d -name "packages"); do
            cp -rf "$pdir/"* dist/latest/packages/ 2>/dev/null || true
          done

          # 准备 GitHub Release 扁平化分发文件清单
          mkdir -p release_dist/
          find release_assets/ -type f \( \
            -name "launcher*" -o \
            -name "*.exe" -o \
            -name "*.zip" -o \
            -name "*.tar.gz" -o \
            -name "*.tar.zst" -o \
            -name "manifest.json" \
          \) -exec cp {} release_dist/ \;

          echo "📦 整理完毕的 dist/latest 结构:"
          ls -la dist/latest/
          echo "📦 整理完毕的 packages 结构:"
          ls -la dist/latest/packages/

      - name: Create Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.precheck.outputs.release_tag }}
          name: "Release ${{ needs.precheck.outputs.release_tag }}"
          draft: false
          prerelease: ${{ contains(needs.precheck.outputs.release_tag, 'alpha') || contains(needs.precheck.outputs.release_tag, 'beta') || contains(needs.precheck.outputs.release_tag, 'rc') }}
          body: |
            ## 📦 Release ${{ needs.precheck.outputs.release_tag }}

            ### 🚀 客户端 / 启动器下载

            | 平台 | 极速启动器 (推荐) | 加速支持 |
            |------|-------------------|----------|
            | Windows (x86_64) | `launcher-windows-x64.exe` | CUDA 12.x + Vulkan |
            | Linux (x86_64, glibc 2.31+) | `launcher-linux-x64` | CUDA 12.x + Vulkan |
            | macOS (ARM64 / Apple Silicon) | `launcher-macos-arm64` | Apple Metal 原生 GPU 加速 |

            ### 💡 运行与更新说明
            - **启动器模式**: 下载对应平台的 `launcher` 直接运行，将全自动从云端极速拉取并同步最新组件和依赖。
            - **CUDA 模式**: NVIDIA 驱动 ≥ 525（推荐 550+），免安装 CUDA Toolkit。
            - **Vulkan 模式**: 支持 Vulkan 1.2+ 的主流显卡（NVIDIA / AMD / Intel Arc / 核显）。
          files: release_dist/*

      - name: Auto-Sync to Hugging Face & ModelScope (Datasets Multi-Version Isolation)
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN || secrets.MODELSCOPE_API_TOKEN }}
          HF_REPO: "vtswcbyy/vflow"
          MS_REPO: "vtswcbyy/vflow"
          RELEASE_TAG: ${{ needs.precheck.outputs.release_tag }}
        run: |
          if [ -z "$HF_TOKEN" ] && [ -z "$MODELSCOPE_TOKEN" ]; then
            echo "ℹ️  未配置 HF_TOKEN 或 MODELSCOPE_TOKEN，跳过云端 Datasets 同步。"
            exit 0
          fi

          echo "================================================================================"
          echo "🚀 [云端自动分发] 启动 Hugging Face & ModelScope 目录级版本隔离并发同步..."
          echo "📌 目标数据集仓库: $MS_REPO (魔塔) & $HF_REPO (Hugging Face)"
          echo "📌 本次发布版本目录: latest/ 与 ${RELEASE_TAG}/"
          echo "--------------------------------------------------------------------------------"

          # 安装 git-lfs
          type -p git-lfs >/dev/null || (sudo apt-get update && sudo apt-get install -y git-lfs) || true

          SYNC_DIR="tmp_cloud_sync_repo"
          mkdir -p "$SYNC_DIR"
          cd "$SYNC_DIR"

          # 优先浅克隆拉取远端已有的历史版本目录 (例如已存在的 v0.1.0/ 等)，实现多版本共存
          CLONED=0
          if [ -n "$HF_TOKEN" ]; then
            git clone --depth 1 "https://user:${HF_TOKEN}@huggingface.co/datasets/${HF_REPO}" . 2>/dev/null && CLONED=1 || true
          fi
          if [ "$CLONED" -eq 0 ] && [ -n "$MODELSCOPE_TOKEN" ]; then
            git clone --depth 1 "https://oauth2:${MODELSCOPE_TOKEN}@www.modelscope.cn/datasets/${MS_REPO}.git" . 2>/dev/null && CLONED=1 || true
          fi

          if [ ! -d ".git" ]; then
            git init -b main
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
          fi

          git lfs install --local
          # 关键：追踪所有二进制文件（包含无后缀的 Linux/macOS launcher）
          git lfs track "launcher*" "*.exe" "*.tar.zst" "*.bin" "*.onnx" "*.gguf" "*.safetensors" "*.dll" "*.dylib" "*.so*"
          git config lfs.concurrenttransfers 8

          echo "📋 正在组织目录级多版本隔离结构..."
          mkdir -p latest "$RELEASE_TAG"

          # 刷新 latest 目录为本次构建最新文件
          rm -rf latest/*
          cp -r ../dist/latest/* latest/ 2>/dev/null || true

          # 写入本次专属版本目录 (永久快照保留，历史版本不受影响)
          rm -rf "${RELEASE_TAG}"/*
          cp -r ../dist/latest/* "$RELEASE_TAG"/ 2>/dev/null || true

          echo ".git_release" > .gitignore
          git add .gitattributes .gitignore
          git add latest/ "$RELEASE_TAG"/

          if git diff --staged --quiet; then
            echo "✨ 检查完毕: 云端分发文件与构建产物完全一致，无新增变更。"
          else
            git commit -m "Release ${RELEASE_TAG} - $(date '+%Y-%m-%d %H:%M:%S')" || true
          fi
          git tag -f "$RELEASE_TAG" 2>/dev/null || true

          PIDS=()
          NAMES=()

          if [ -n "$HF_TOKEN" ]; then
            echo "☁️  [Hugging Face] 配置远程目标: https://huggingface.co/datasets/${HF_REPO}"
            git remote add origin-hf "https://user:${HF_TOKEN}@huggingface.co/datasets/${HF_REPO}"
            echo "🚀 [Hugging Face] 后台并发推送 main 分支中..."
            git push -u origin-hf main --force &
            PIDS+=($!)
            NAMES+=("Hugging Face")
          fi

          if [ -n "$MODELSCOPE_TOKEN" ]; then
            echo "☁️  [ModelScope 魔塔] 配置远程目标: https://www.modelscope.cn/datasets/${MS_REPO}.git"
            git remote add origin-ms "https://oauth2:${MODELSCOPE_TOKEN}@www.modelscope.cn/datasets/${MS_REPO}.git"
            echo "🚀 [ModelScope 魔塔] 后台并发推送 master & main 分支中..."
            # 魔塔默认分支为 master，同时推送 master 和 main 确保网页和 API 双端秒级可见
            (git push -u origin-ms main:master --force && git push origin-ms main --force 2>/dev/null || true) &
            PIDS+=($!)
            NAMES+=("ModelScope 魔塔")
          fi

          FAIL_COUNT=0
          for i in "${!PIDS[@]}"; do
            pid="${PIDS[$i]}"
            name="${NAMES[$i]}"
            if wait "$pid"; then
              echo "✅ [$name] 同步成功！"
            else
              echo "⚠️  [$name] 推送遇到问题，请检查 Token 写入权限。"
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          done

          echo "================================================================================"
          echo "🎉 云端 Datasets 同步执行完毕 (失败数: $FAIL_COUNT)"
          echo "================================================================================"
